[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-qa-dataset"
version = "0.1.0"
description = "Generate and validate a synthetic QA dataset from documentation files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.2.6",
    "openai>=3.20.0",
    "python-dotenv>=1.2.3",
    "chromadb",
    "langchain",
    "langchain-community",
    "langchain-text-splitters",
    "pypdf",
    "docx2txt",
    "tiktoken",
]

[project.scripts]
synthetic-qa-generate = "synthetic_qa_dataset.dataset_generator:main"
synthetic-qa-evaluate = "synthetic_qa_dataset.eval_synthetic_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["evals", "datasets", "markdowns_support"]

[dependency-groups]
dev = [
    "black[jupyter]>=26.10.0",
    "ruff>=0.16.10",
]
