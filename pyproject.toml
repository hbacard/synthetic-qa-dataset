[project]
name = "synthetic-qa-dataset"
version = "0.1.0"
description = "Generate and validate a synthetic QA dataset from documentation files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.2.6",
    "openai>=3.20.0",
    "python-dotenv>=1.2.3",
    "chromadb",
    "langchain",
    "langchain-community",
    "langchain-text-splitters",
    "pypdf",
    "docx2txt",
    "tiktoken",
]

[tool.setuptools]
py-modules = [
    "config",
    "dataset_generator",
    "eval_synthetic_dataset",
    "paths",
    "providers",
    "test_hallucination_metric",
]

[tool.setuptools.packages.find]
include = []
exclude = ["evals", "datasets", "markdowns_support"]

[dependency-groups]
dev = [
    "black[jupyter]>=26.10.0",
    "ruff>=0.16.10",
]
